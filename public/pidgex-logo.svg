<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue Paloma Gradients -->
    <linearGradient id="realDoveBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="realDoveWingBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="realDoveWingFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="realDoveBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="realDoveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Black Badge Frame -->
  <circle cx="200" cy="200" r="192" fill="#000000" stroke="#00d4ff" stroke-width="4" />
  <circle cx="200" cy="200" r="184" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.6" />

  <!-- REAL PLUMP PALOMA MENSAJERA (Paloma Gordita Real con Cabeza, Pico, Pecho y Patas) -->
  <g transform="translate(195, 210) scale(1.4)" filter="url(#realDoveGlow)">
    
    <!-- 1. FAR WING (Ala Trasera) -->
    <g>
      <path d="M -15,-20 C -50,-75 -25,-120 15,-140 C 30,-148 42,-132 30,-100 C 15,-60 -5,-28 -15,-20 Z" fill="url(#realDoveWingBack)"/>
      <path d="M -8,-32 C -38,-80 -10,-128" stroke="#bae6fd" stroke-width="3" fill="none" opacity="0.8"/>
      <path d="M 0,-38 C -25,-82 -2,-118" stroke="#bae6fd" stroke-width="3" fill="none" opacity="0.8"/>
    </g>

    <!-- 2. FAN TAIL FEATHERS (Cola Gordita de Paloma en Abanico) -->
    <g>
      <path d="M 20,40 C 45,75 80,98 115,110 C 122,105 115,92 90,75 C 60,55 32,38 20,40 Z" fill="#1d4ed8"/>
      <path d="M 25,48 C 55,88 95,112 130,122 C 136,118 126,102 98,85 Q 65,60 25,48 Z" fill="#2563eb"/>
      <path d="M 28,55 Q 65,100 138,130 Q 144,124 112,98 Q 70,68 28,55 Z" fill="#0284c7"/>
      <path d="M 30,62 Q 72,108 142,138 Q 146,130 120,105 Q 75,75 30,62 Z" fill="#38bdf8"/>
      <path d="M 32,68 Q 78,112 144,142 Q 148,135 125,112 Q 78,82 32,68 Z" fill="#7dd3fc"/>
    </g>

    <!-- 3. PINK FEET & CLAWS (Patas Rosadas de Paloma) -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Back Leg -->
      <path d="M -18,42 L -20,58" stroke="#e11d48" stroke-width="3" />
      <path d="M -20,58 L -30,66" stroke="#e11d48" stroke-width="2.5" />
      <path d="M -20,58 L -22,68" stroke="#e11d48" stroke-width="2.5" />
      <path d="M -20,58 L -14,67" stroke="#e11d48" stroke-width="2.5" />
      <path d="M -20,58 L -10,54" stroke="#e11d48" stroke-width="2.5" />

      <!-- Front Leg -->
      <path d="M -35,38 L -38,55" stroke="#f43f5e" stroke-width="3.2" />
      <path d="M -38,55 L -48,64" stroke="#f43f5e" stroke-width="2.8" />
      <path d="M -38,55 L -41,67" stroke="#f43f5e" stroke-width="2.8" />
      <path d="M -38,55 L -31,66" stroke="#f43f5e" stroke-width="2.8" />
      <path d="M -38,55 L -27,51" stroke="#f43f5e" stroke-width="2.8" />
    </g>

    <!-- 4. VERY PLUMP PIGEON BODY & BIG ROUND CHEST (Cuerpo de Paloma Bien Gordito) -->
    <g>
      <path d="
        M -55,-22
        C -75,-28 -98,-20 -108,-8
        C -118,2 -120,18 -112,34
        C -102,52 -78,62 -45,58
        C -15,75 12,98 45,115
        C 75,128 108,134 135,135
        C 98,118 62,92 30,65
        C 0,40 -20,12 -38,-10
        C -45,-18 -50,-20 -55,-22
        Z
      " fill="url(#realDoveBody)"/>

      <!-- Plump Chest Light Accent -->
      <path d="
        M -60,-18
        C -85,-5 -102,18 -92,38
        C -82,55 -52,58 -22,36
        C -45,15 -52,-5 -60,-18
        Z
      " fill="#7dd3fc" opacity="0.75"/>
    </g>

    <!-- 5. REAL ROUND PIGEON HEAD, EYE & CORAL BEAK WITH CERE -->
    <g>
      <!-- Round Pigeon Head -->
      <circle cx="-62" cy="-28" r="23" fill="url(#realDoveBody)"/>

      <!-- Eye with Amber Iris & Pupil -->
      <circle cx="-72" cy="-30" r="5.5" fill="#000000"/>
      <circle cx="-72" cy="-30" r="4.0" fill="#f59e0b"/>
      <circle cx="-72" cy="-30" r="2.2" fill="#000000"/>
      <circle cx="-75" cy="-33" r="1.5" fill="#ffffff"/>

      <!-- White Cere bump on beak -->
      <ellipse cx="-82" cy="-26" rx="4.5" ry="3.5" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>

      <!-- Pigeon Beak -->
      <path d="M -85,-27 C -100,-26 -104,-22 -87,-18 C -84,-19 -83,-23 -85,-27 Z" fill="url(#realDoveBeak)"/>
    </g>

    <!-- 6. BROAD BLUE FEATHERED WING -->
    <g>
      <path d="
        M -35,-32
        C -55,-88 -35,-160 20,-198
        C 42,-210 62,-190 48,-150
        C 25,-98 -5,-48 -35,-32
        Z
      " fill="url(#realDoveWingFront)"/>

      <path d="M 5,-140 C 22,-198 42,-210 48,-190 C 40,-160 22,-120 5,-140 Z" fill="#e0f2fe"/>
      <path d="M -2,-118 C 14,-172 30,-190 36,-172 C 28,-145 10,-105 -2,-118 Z" fill="#bae6fd"/>
      <path d="M -8,-96 C 6,-150 20,-168 26,-150 C 18,-128 2,-86 -8,-96 Z" fill="#7dd3fc"/>
      <path d="M -14,-74 C -2,-122 10,-140 17,-122 C 10,-105 -3,-68 -14,-74 Z" fill="#38bdf8"/>
      <path d="M -22,-52 C -12,-98 2,-112 8,-98 C 2,-82 -12,-48 -22,-52 Z" fill="#0284c7"/>

      <path d="
        M -35,-32
        C -45,-68 -28,-110 5,-132
        C 20,-140 30,-125 20,-96
        C 5,-62 -20,-38 -35,-32
        Z
      " fill="#7dd3fc" opacity="0.6"/>
    </g>

    <!-- 7. MESSENGER ENVELOPE IN BEAK -->
    <g transform="translate(-98, -18) rotate(12)">
      <rect x="0" y="0" width="26" height="18" rx="2.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
      <path d="M 1 1 L 13 11 L 25 1" stroke="#1d4ed8" stroke-width="1.8" fill="none"/>
      <path d="M 13 11 C 12 9, 9.5 9, 9.5 10.5 C 9.5 12, 13 14, 13 14 C 13 14, 16.5 12, 16.5 10.5 C 16.5 9, 14 9, 13 11 Z" fill="#2563eb"/>
    </g>

  </g>
</svg>
